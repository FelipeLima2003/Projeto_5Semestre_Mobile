# ============================================================
# Configurações de Teste 
# Usa H2 em memória no lugar do PostgreSQL 
# ============================================================

Banco H2 em memória com compatibilidade PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=



# Dialeto H2
# Cria o schema antes dos testes e destrói depois — sem dados sujos
spring.jpa.hibernate.ddl-auto=create-drop

# Mantém o SQL visível para facilitar debug dos testes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# JWT — chave fixa para testes (não usa variável de ambiente)
api.security.token.secret=chave-secreta-de-teste-para-junit-123456

# Upload — desativado nos testes de integração
file.upload-dir=./uploads-test/



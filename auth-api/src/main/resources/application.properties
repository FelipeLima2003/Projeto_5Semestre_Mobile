# Subir api


spring.application.name=auth-api

# =========================================================================
# 1. CONEXÃO COM O BANCO DE DADOS (POSTGRESQL)

# =========================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/runconnect_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Definição correta do Driver e Dialeto do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================================================================
# 2. CONFIGURAÇÕES DO HIBERNATE / JPA
# =========================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================================
# 3. STORAGE / UPLOADS DE IMAGEM

# =========================================================================
file.upload-dir=./uploads/

# =========================================================================
# 4. SEGURANÇA / JWT

# =========================================================================
api.security.token.secret=${JWT_SECRET:chave-secreta-de-desenvolvimento-local-123456}

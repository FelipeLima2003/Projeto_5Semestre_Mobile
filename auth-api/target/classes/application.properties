spring.application.name=auth-api

# spring.datasource.url=jdbc:mysql://www.thyagoquintas.com.br:3306/engenharia_65?useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=engenharia_65
# spring.datasource.password=loboguara

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Conexão com o banco de dados MySQL

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


